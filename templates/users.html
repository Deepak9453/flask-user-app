<!DOCTYPE html>
<html>
<head>
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/">User App</a>
    <div>
        <a href="/" class="btn btn-outline-light btn-sm">Home</a>
        <a href="/new_user" class="btn btn-success btn-sm">Add User</a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4 text-center">Users List</h2>

    <table class="table table-bordered table-striped shadow">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name (Click)</th>
                <th>Email</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>
                    <a href="/users/{{ user.id }}" class="text-decoration-none">
                        {{ user.name }}
                    </a>
                </td>
                <td>{{ user.email }}</td>
                <td>{{ user.role }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
