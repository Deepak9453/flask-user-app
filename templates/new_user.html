<!DOCTYPE html>
<html>
<head>
    <title>Add User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/">User App</a>
    <div>
        <a href="/" class="btn btn-outline-light btn-sm">Home</a>
        <a href="/users" class="btn btn-primary btn-sm">Users</a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4 text-center">Add New User</h2>

    <form method="post" class="card p-4 shadow col-md-6 mx-auto">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Role</label>
            <input type="text" name="role" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success w-100">Add User</button>

    </form>

</div>

</body>
</html>
